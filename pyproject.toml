[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding using LLMs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "llm-sdk"
]
[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[tool.mypy]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_missing_imports = true
ignore_errors = true